<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>어머니를 위한 스마트 달력</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            background-color: #000;
            transition: background-color 1s ease-in-out;
        }
        
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 1/3 영역: 시간, 날짜, 날씨, 사진 배경 */
        .left-panel {
            width: 32%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            color: white;
            padding: 20px 10px;
            text-align: center;
            border-right: 3px solid white;
            overflow: hidden;
            transition: border-color 1s ease-in-out;
        }
        .bg-slider {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            opacity: 0;
            z-index: 1;
        }
        .bg-slider.active {
            opacity: 1;
        }
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2); 
            z-index: 2;
            transition: background 1s ease-in-out;
        }
        .left-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 20px 5px;
            align-items: center;
            justify-content: flex-start;
        }

        .time-display { 
            display: flex; 
            align-items: baseline; 
            justify-content: center;
            gap: 6px; 
            color: white;
        }
        .ampm-small { 
            font-size: 2.2rem; 
            color: #ffeb3b; 
        }
        .time-large { 
            font-size: 4.5rem; 
            font-weight: 800; 
        }

        .date { font-size: 3.2rem; color: orange; font-weight: bold; line-height: 1.4; word-break: keep-all; }
        
        .weather-box {
            margin-top: auto;
            background: rgba(100, 100, 100, 0.5);
            padding: 8px 12px; 
            border-radius: 15px;
            z-index: 4;
            width: 95%;
        }

        /* 오른쪽 2/3 영역: 달력 */
        .right-panel {
            width: 68%;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            padding: 25px 25px;
            transition: background-color 1s ease-in-out, color 1s ease-in-out;
        }
        .calendar-header {
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: #1a237e;
            transition: color 1s ease-in-out;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, 1fr);
            flex-grow: 1;
            gap: 5px;
        }
        .day-label {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 2px solid #ccc;
            transition: border-color 1s ease-in-out;
        }
        .day-label:nth-child(1) { color: #d32f2f; } 
        .day-label:nth-child(7) { color: #1976d2; } 

        .cell {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #fafafa;
            overflow: hidden;
            transition: background-color 1s ease-in-out, border-color 1s ease-in-out;
        }
        .cell .day-num {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .cell.sun .day-num { color: #d32f2f; }
        .cell.sat .day-num { color: #1976d2; }
        
        .cell.today {
            background-color: #e8f5e9;
            border: 4px solid #2e7d32;
        }
        .cell.today .day-num {
            color: #1b5e20;
            font-size: 2rem;
        }

        /* 공휴일 이름 스타일 */
        .holiday-text {
            margin-top: 2px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #d32f2f;
            text-align: center;
        }

        .sched-text {
            margin-top: auto; 
            font-size: 1.15rem;
            font-weight: bold;
            color: #ee82ee; 
            padding: 1px 1px;
            border-radius: 4px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }    
        
        .weather-row { 
            display: flex; 
            justify-content: space-between; 
        }
        .weather-col { 
            flex: 1; 
            text-align: center; 
            padding: 0 5px;
        }
        .weather-title { font-size:2.0rem; font-weight: bold; margin-bottom: 5px; color: #81d4fa; }

        /* 🌙 밤 시간대 어머니의 눈을 위한 우아한 다크모드 스타일 */
        body.dark-mode .right-panel { background-color: #1a1a1a; color: #e0e0e0; }
        body.dark-mode .left-panel { border-right: 3px solid #333; }
        body.dark-mode .calendar-header { color: #90caf9; }
        body.dark-mode .day-label { border-bottom: 2px solid #444; }
        body.dark-mode .cell { background-color: #262626; border: 1px solid #3a3a3a; }
        body.dark-mode .cell.sun .day-num { color: #ef9a9a; }
        body.dark-mode .cell.sat .day-num { color: #90caf9; }
        body.dark-mode .holiday-text { color: #ef9a9a; }
        body.dark-mode .cell.today { background-color: #1b5e20; border: 4px solid #4caf50; }
        body.dark-mode .cell.today .day-num { color: #a5d6a7; }
    </style>
</head>
<body>

    <div class="container">
        <div class="left-panel">
            <div class="bg-slider active" id="bgSlider1"></div>
            <div class="bg-slider" id="bgSlider2"></div>

            <div class="bg-overlay"></div>
            <div class="left-content">
                <div class="date" id="date">1월 1일<br>(목요일)</div>
                <div class="time-display" id="time-display">오전 00:00</div>
                
                <div class="weather-box">
                    <div class="weather-row">
                        <div class="weather-col">
                            <div class="weather-title">오늘</div>
                            <div id="weather-today" style="font-size: 0.9em;">...</div>
                        </div>
                        <div class="weather-col" style="border-left: 1px solid rgba(255,255,255,0.3);">
                            <div class="weather-title">내일</div>
                            <div id="weather-tomorrow" style="font-size: 0.9em;">...</div>
                        </div>
                    </div>
                </div>
             </div>
        </div>

        <div class="right-panel">
            <div class="calendar-header" id="calendarMonth">2026년 1월</div>
            <div class="calendar-grid" id="calendarGrid">
                <div class="day-label" style="color:#d32f2f">일</div>
                <div class="day-label">월</div>
                <div class="day-label">화</div>
                <div class="day-label">수</div>
                <div class="day-label">목</div>
                <div class="day-label">금</div>
                <div class="day-label" style="color:#1976d2">토</div>
            </div>
        </div>
    </div>

    <script>
        // ================= [ 사용자 설정 영역 ] =================
        let photoFiles = []; 
        const photoExtensions = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG']; 

        const photoChangeInterval = 10000; 
        const scheduleFetchInterval = 60000; 
        
        const LATITUDE = 37.6377;
        const LONGITUDE = 126.8392;

        // ==== [ 밝기/어둠 제어 설정 ] ====
        const EVENING_START = 20;  // 🌙 저녁 모드 시작 시간 (오후 8시)
        const NIGHT_START = 22;    // 🛏️ 심야 모드 시작 시간 (밤 10시)
        const DAY_START = 6;       // ☀️ 낮 모드 시작 시간 (아침 6시)

        const EVENING_DARKNESS = 0.45; // 저녁 슬라이더 어두워지는 투명도
        const NIGHT_DARKNESS = 0.75;   // 밤에 깜깜해지는 투명도

        // 🎯 대한민국 공휴일 데이터베이스 (2026년 ~ 2027년 전체 확정본)
        const koreanHolidays = {
            // 1. 매년 고정된 양력 국경일
            "01-01": "신정",
            "03-01": "삼일절",
            "05-05": "어린이날",
            "06-06": "현충일",
            "08-15": "광복절",
            "10-03": "개천절",
            "10-09": "한글날",
            "12-25": "성탄절",

            // 2. 2026년 음력 명절 및 대체공휴일
            "2026-02-17": "설날",
            "2026-02-18": "설날",
            "2026-02-19": "설날",
            "2026-05-25": "대체공휴일", 
            "2026-09-24": "추석",
            "2026-09-25": "추석",
            "2026-09-26": "추석",
            "2026-09-28": "대체공휴일", 

            // 3. 2027년 음력 명절 및 대체공휴일
            "2027-02-05": "설날 연휴",
            "2027-02-06": "설날",
            "2027-02-07": "설날 연휴",
            "2027-02-08": "대체공휴일", 
            "2027-05-13": "부처님오신날",
            "2027-06-07": "대체공휴일", 
            "2027-08-16": "대체공휴일", 
            "2027-10-04": "대체공휴일", 
            "2027-10-11": "대체공휴일", 
            "2027-10-14": "추석 연휴",
            "2027-10-15": "추석",
            "2027-10-16": "추석 연휴",
            "2027-10-18": "대체공휴일", 
            "2027-12-27": "대체공휴일"  
        };
        // ========================================================

        let currentSchedules = {};
        let photoIndex = 0;
        let currentBg = 1;

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);  
                img.onerror = () => resolve(false); 
                img.src = url;
            });
        }
   
        async function discoverPhotos() {
            let i = 1;
            while (true) {
                let found = false;
                for (const ext of photoExtensions) {
                    const testUrl = `photo${i}.${ext}`;
                    const exists = await checkImageExists(testUrl);
                    
                    if (exists) {
                        photoFiles.push(testUrl); 
                        found = true;
                        break; 
                    }
                }
                if (!found) {
                    break;
                }
                i++;
            }
         
            if (photoFiles.length > 0) {
                updateBackground();
            } else {
                console.log("포토 파일을 하나도 찾지 못했습니다.");
            }
        }

        // 1. 시계 업데이트 및 시간대별 야간 감광 제어 연동
        function updateClock() {
            const now = new Date();
            const hours24 = now.getHours();
            const ampmStr = hours24 >= 12 ? "오후" : "오전";

            let hours12 = hours24 % 12;
            hours12 = hours12 ? hours12 : 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('time-display').innerHTML = 
                `<span class="ampm-small">${ampmStr}</span><span class="time-large">${hours12}:${minutes}</span>`;
            
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekDays = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
            const dayName = weekDays[now.getDay()];
            
            document.getElementById('date').innerHTML = `${month}월 ${date}일<br>(${dayName})`;
            
            // 사용자가 설정한 변수값으로 배경 투명도 및 다크모드 제어
            const overlay = document.querySelector('.bg-overlay');
            if (hours24 >= NIGHT_START || hours24 < DAY_START) {
                overlay.style.backgroundColor = `rgba(0, 0, 0, ${NIGHT_DARKNESS})`;
                document.body.classList.add('dark-mode'); 
            } else if (hours24 >= EVENING_START) {
                overlay.style.backgroundColor = `rgba(0, 0, 0, ${EVENING_DARKNESS})`;
                document.body.classList.remove('dark-mode'); 
            } else {
                overlay.style.backgroundColor = `rgba(0, 0, 0, 0.25)`; 
                document.body.classList.remove('dark-mode'); 
            }

            if (now.getSeconds() === 0 && now.getMinutes() === 0) {
                renderCalendar();
            }
        }

        // 2. 배경 사진 슬라이드쇼
        function updateBackground() {
            if (photoFiles.length === 0) return;
         
            const nextBg = currentBg === 1 ? 2 : 1;
            const currentSlider = document.getElementById(`bgSlider${currentBg}`);
            const nextSlider = document.getElementById(`bgSlider${nextBg}`);
            
            nextSlider.style.backgroundImage = `url('${photoFiles[photoIndex]}?v=${Date.now()}')`;
         
            nextSlider.classList.add('active');
            currentSlider.classList.remove('active');
            
            currentBg = nextBg;
            photoIndex = (photoIndex + 1) % photoFiles.length;
        }

        // 3. 스케줄 JS 파일 로드
        function fetchSchedules() {
            const isLocal = window.location.protocol === 'file:';
            const cacheBust = isLocal ? '' : `?nocache=${Date.now()}`;
            
            const oldScript = document.getElementById('dynamic-schedule-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'dynamic-schedule-script';
            script.src = `schedule.js${cacheBust}`;
            
            script.onload = function() {
                if (window.mySchedules) {
                    currentSchedules = window.mySchedules;
                    renderCalendar();
                }
            };

            document.body.appendChild(script);
        }

        // 4. 날씨 API 호출
        function fetchWeather() {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul`;
         
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const today = getWeatherInfo(data.daily.weathercode[0]);
                    const todayMax = Math.round(data.daily.temperature_2m_max[0]);
                    const todayMin = Math.round(data.daily.temperature_2m_min[0]);
                    document.getElementById('weather-today').innerHTML = `
                        <div style="font-size: 4rem; margin: 5px 0;">${today.emoji}</div>
                        <div style="font-size: 2rem; font-weight: bold;">${todayMin}°~${todayMax}°</div>
                    `;

                    const tomorrow = getWeatherInfo(data.daily.weathercode[1]);
                    const tomorrowMax = Math.round(data.daily.temperature_2m_max[1]);
                    const tomorrowMin = Math.round(data.daily.temperature_2m_min[1]);
                    document.getElementById('weather-tomorrow').innerHTML = `
                        <div style="font-size: 4rem; margin: 5px 0;">${tomorrow.emoji}</div>
                        <div style="font-size: 2rem; font-weight: bold;">${tomorrowMin}°~${tomorrowMax}°</div>
                    `;
                })
                .catch(() => {
                    document.getElementById('weather-today').innerText = "날씨 정보 없음";
                });
        }

        function getWeatherInfo(code) {
            if (code === 0) return { emoji: '☀️', desc: '맑음' };
            if ([1, 2, 3].includes(code)) return { emoji: '⛅', desc: '구름조금' };
            if ([45, 48].includes(code)) return { emoji: '🌫️', desc: '안개' };
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { emoji: '🌧️', desc: '비가끔' };
            if ([71, 73, 75, 85, 86].includes(code)) return { emoji: '❄️', desc: '눈' };
            if ([95, 96, 99].includes(code)) return { emoji: '⚡', desc: '번개' };
            return { emoji: '☁️', desc: '흐림' };
        }

        // 5. 달력 생성 및 공휴일 렌더링
        function renderCalendar() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); 
            const todayDate = now.getDate();

            document.getElementById('calendarMonth').innerText = `${currentYear}년 ${currentMonth + 1}월`;

            const grid = document.getElementById('calendarGrid');
            const labels = grid.querySelectorAll('.day-label');
            grid.innerHTML = '';
            labels.forEach(label => grid.appendChild(label));

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const blankCell = document.createElement('div');
                blankCell.className = 'cell';
                grid.appendChild(blankCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const dayOfWeek = (firstDayIndex + day - 1) % 7;
                if (dayOfWeek === 0) cell.classList.add('sun');
                if (dayOfWeek === 6) cell.classList.add('sat');

                if (day === todayDate) {
                    cell.classList.add('today');
                }

                const dayNumSpan = document.createElement('span');
                dayNumSpan.className = 'day-num';
                dayNumSpan.innerText = day;
                cell.appendChild(dayNumSpan);

                const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const solarKey = `${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const holidayName = koreanHolidays[dateKey] || koreanHolidays[solarKey];
                
                // 오늘이 공휴일인 경우 빨간색 지정 및 명칭 표기
                if (holidayName) {
                    cell.classList.add('sun'); 
                    const holidayDiv = document.createElement('div');
                    holidayDiv.className = 'holiday-text';
                    holidayDiv.innerText = holidayName;
                    cell.appendChild(holidayDiv);
                }

                // 어머니 개인 일정 표기
                if (currentSchedules[dateKey]) {
                    const schedDiv = document.createElement('div');
                    schedDiv.className = 'sched-text';
                    schedDiv.innerText = currentSchedules[dateKey];
                    cell.appendChild(schedDiv);
                }

                grid.appendChild(cell);
            }
        }

        // 시스템 시작
        updateClock();
        setInterval(updateClock, 1000);

        discoverPhotos(); 
        setInterval(updateBackground, photoChangeInterval);

        renderCalendar(); 
        fetchSchedules();
        setInterval(fetchSchedules, scheduleFetchInterval);

        fetchWeather();
        setInterval(fetchWeather, 1800000); 
    </script>
</body>
</html>
