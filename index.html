<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>어머니를 위한 스마트 달력</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            background-color: #000;
        }
        
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 1/3 영역: 시간, 날짜, 날씨, 사진 배경 */
        .left-panel {
            width: 32%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            color: white;
            padding: 20px 10px;
            text-align: center;
            border-right: 3px solid white;
            overflow: hidden;
        }
        .bg-slider {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            opacity: 0;
            z-index: 1;
        }
        .bg-slider.active {
            opacity: 1;
        }
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.35); /* ◀ 글씨가 선명하게 보이도록 공백 오류 수정 및 선명도 조절 */
            z-index: 2;
        }
        .left-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 20px 5px;
            align-items: center;
            justify-content: flex-start;
        }

        .time-display { 
            display: flex; 
            align-items: baseline; 
            justify-content: center;
            gap: 6px; 
            color: white;
        }
        .ampm-small { 
            font-size: 2.2rem; 
            color: #ffeb3b; 
        }
        .time-large { 
            font-size: 4.5rem; 
            font-weight: 800; 
        }

        .date { font-size: 3.2rem; color: orange; font-weight: bold; line-height: 1.4; word-break: keep-all; }
        
        .weather-box {
            margin-top: auto;
            background: rgba(100, 100, 100, 0.5);
            padding: 8px 12px; 
            border-radius: 15px;
            z-index: 4;
            width: 95%;
        }
        .weather-title { font-weight: bold; margin-bottom: 8px; color: #81d4fa; }

        /* 오른쪽 2/3 영역: 달력 */
        .right-panel {
            width: 68%;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            padding: 25px 25px;
        }
        .calendar-header {
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
            color: #1a237e;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, 1fr);
            flex-grow: 1;
            gap: 5px;
        }
        .day-label {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding-bottom: 10px;
            border-bottom: 2px solid #ccc;
        }
        .day-label:nth-child(1) { color: #d32f2f; } 
        .day-label:nth-child(7) { color: #1976d2; } 

        .cell {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            background-color: #fafafa;
            overflow: hidden;
        }
        .cell .day-num {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .cell.sun .day-num { color: #d32f2f; }
        .cell.sat .day-num { color: #1976d2; }
        
        .cell.today {
            background-color: #e8f5e9;
            border: 4px solid #2e7d32;
        }
        .cell.today .day-num {
            color: #1b5e20;
            font-size: 2rem;
        }

        .sched-text {
            margin-top: 4px;
            font-size: 1.15rem;
            font-weight: bold;
            color: #ee82ee; 
            padding: 1px 1px;
            border-radius: 4px;
            width: 100%;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }    
        
        .weather-row { 
            display: flex; 
            justify-content: space-between; 
        }
        .weather-col { 
            flex: 1; 
            text-align: center; 
            padding: 0 5px;
        }
        .weather-title { font-size:2.0rem; font-weight: bold; margin-bottom: 5px; color: #81d4fa; }
    </style>
</head>
<body>

    <div class="container">
        <div class="left-panel">
            <div class="bg-slider active" id="bgSlider1"></div>
            <div class="bg-slider" id="bgSlider2"></div>

            <div class="bg-overlay"></div>
            <div class="left-content">
                <div class="date" id="date">1월 1일<br>(목요일)</div>
                <div class="time-display" id="time-display">오전 00:00</div>
                
                <div class="weather-box">
                    <div class="weather-row">
                        <div class="weather-col">
                            <div class="weather-title">오늘</div>
                            <div id="weather-today" style="font-size: 0.9em;">...</div>
                        </div>
                        <div class="weather-col" style="border-left: 1px solid rgba(255,255,255,0.3);">
                            <div class="weather-title">내일</div>
                            <div id="weather-tomorrow" style="font-size: 0.9em;">...</div>
                        </div>
                    </div>
                </div>
             </div>
        </div>

        <div class="right-panel">
            <div class="calendar-header" id="calendarMonth">2026년 1월</div>
            <div class="calendar-grid" id="calendarGrid">
                <div class="day-label" style="color:#d32f2f">일</div>
                <div class="day-label">월</div>
                <div class="day-label">화</div>
                <div class="day-label">수</div>
                <div class="day-label">목</div>
                <div class="day-label">금</div>
                <div class="day-label" style="color:#1976d2">토</div>
            </div>
        </div>
    </div>

    <script>
        // ================= [ 사용자 설정 영역 ] =================
        let photoFiles = []; 
        const photoExtensions = ['jpg', 'JPG', 'jpeg', 'JPEG', 'png', 'PNG']; 

        const photoChangeInterval = 10000; 
        const scheduleFetchInterval = 60000; 
        
        const LATITUDE = 37.5665;
        const LONGITUDE = 126.9780;
        // ========================================================

        let currentSchedules = {};
        let photoIndex = 0;
        let currentBg = 1;

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);  
                img.onerror = () => resolve(false); 
                img.src = url;
            });
        }
   
        async function discoverPhotos() {
            let i = 1;
            while (true) {
                let found = false;
                for (const ext of photoExtensions) {
                    const testUrl = `photo${i}.${ext}`;
                    const exists = await checkImageExists(testUrl);
                    
                    if (exists) {
                        photoFiles.push(testUrl); 
                        found = true;
                        break; 
                    }
                }
                if (!found) {
                    break;
                }
                i++;
            }
         
            // 🎯 사진을 전부 다 찾았을 때, 비로소 첫 번째 배경 이미지를 띄워줍니다.
            if (photoFiles.length > 0) {
                updateBackground();
            } else {
                console.log("포토 파일을 하나도 찾지 못했습니다. 파일명(photo1...)과 위치를 확인해주세요.");
            }
        }

        // 1. 시계 및 날짜 업데이트 (매 초 작동)
        function updateClock() {
            const now = new Date();
            const hours24 = now.getHours();
            const ampmStr = hours24 >= 12 ? "오후" : "오전";

            let hours12 = hours24 % 12;
            hours12 = hours12 ? hours12 : 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('time-display').innerHTML = 
                `<span class="ampm-small">${ampmStr}</span><span class="time-large">${hours12}:${minutes}</span>`;
            
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const weekDays = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
            const dayName = weekDays[now.getDay()];
            
            document.getElementById('date').innerHTML = `${month}월 ${date}일<br>(${dayName})`;
            
            if (now.getSeconds() === 0 && now.getMinutes() === 0) {
                renderCalendar();
            }
        }

        // 2. 배경 사진 슬라이드쇼
        function updateBackground() {
            if (photoFiles.length === 0) return;
         
            const nextBg = currentBg === 1 ? 2 : 1;
            const currentSlider = document.getElementById(`bgSlider${currentBg}`);
            const nextSlider = document.getElementById(`bgSlider${nextBg}`);
            
            nextSlider.style.backgroundImage = `url('${photoFiles[photoIndex]}?v=${Date.now()}')`;
         
            nextSlider.classList.add('active');
            currentSlider.classList.remove('active');
            
            currentBg = nextBg;
            photoIndex = (photoIndex + 1) % photoFiles.length;
        }

        // 3. 서버 또는 로컬에서 스케줄 JS 파일 가져오기
        function fetchSchedules() {
            const isLocal = window.location.protocol === 'file:';
            const cacheBust = isLocal ? '' : `?nocache=${Date.now()}`;
            
            const oldScript = document.getElementById('dynamic-schedule-script');
            if (oldScript) oldScript.remove();

            const script = document.createElement('script');
            script.id = 'dynamic-schedule-script';
            script.src = `schedule.js${cacheBust}`;
            
            script.onload = function() {
                if (window.mySchedules) {
                    currentSchedules = window.mySchedules;
                    renderCalendar();
                }
            };
            
            script.onerror = function() {
                console.log('schedule.js 파일을 찾을 수 없습니다.');
            };

            document.body.appendChild(script);
        }

        // 4. 공공 날씨 API 호출
        function fetchWeather() {
            // 🎯 주소 내부 오타와 공백 제거 완료
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul`;
         
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const today = getWeatherInfo(data.daily.weathercode[0]);
                    const todayMax = Math.round(data.daily.temperature_2m_max[0]);
                    const todayMin = Math.round(data.daily.temperature_2m_min[0]);
                    document.getElementById('weather-today').innerHTML = `
                        <div style="font-size: 4rem; margin: 5px 0;">${today.emoji}</div>
                        <div style="font-size: 2rem; font-weight: bold;">${todayMin}°~${todayMax}°</div>
                    `;

                    const tomorrow = getWeatherInfo(data.daily.weathercode[1]);
                    const tomorrowMax = Math.round(data.daily.temperature_2m_max[1]);
                    const tomorrowMin = Math.round(data.daily.temperature_2m_min[1]);
                    document.getElementById('weather-tomorrow').innerHTML = `
                        <div style="font-size: 4rem; margin: 5px 0;">${tomorrow.emoji}</div>
                        <div style="font-size: 2rem; font-weight: bold;">${tomorrowMin}°~${tomorrowMax}°</div>
                    `;
                })
                .catch(() => {
                    document.getElementById('weather-today').innerText = "날씨 정보 없음";
                });
        }

        function getWeatherInfo(code) {
            if (code === 0) return { emoji: '☀️', desc: '맑음' };
            if ([1, 2, 3].includes(code)) return { emoji: '⛅', desc: '구름조금' };
            if ([45, 48].includes(code)) return { emoji: '🌫️', desc: '안개' };
            if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { emoji: '🌧️', desc: '비가끔' };
            if ([71, 73, 75, 85, 86].includes(code)) return { emoji: '❄️', desc: '눈' };
            if ([95, 96, 99].includes(code)) return { emoji: '⚡', desc: '번개' };
            return { emoji: '☁️', desc: '흐림' };
        }

        // 5. 달력 생성 및 스케줄 매핑
        function renderCalendar() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); 
            const todayDate = now.getDate();

            document.getElementById('calendarMonth').innerText = `${currentYear}년 ${currentMonth + 1}월`;

            const grid = document.getElementById('calendarGrid');
            const labels = grid.querySelectorAll('.day-label');
            grid.innerHTML = '';
            labels.forEach(label => grid.appendChild(label));

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const blankCell = document.createElement('div');
                blankCell.className = 'cell';
                grid.appendChild(blankCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const dayOfWeek = (firstDayIndex + day - 1) % 7;
                if (dayOfWeek === 0) cell.classList.add('sun');
                if (dayOfWeek === 6) cell.classList.add('sat');

                if (day === todayDate) {
                    cell.classList.add('today');
                }

                const dayNumSpan = document.createElement('span');
                dayNumSpan.className = 'day-num';
                dayNumSpan.innerText = day;
                cell.appendChild(dayNumSpan);

                const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                if (currentSchedules[dateKey]) {
                    const schedDiv = document.createElement('div');
                    schedDiv.className = 'sched-text';
                    schedDiv.innerText = currentSchedules[dateKey];
                    cell.appendChild(schedDiv);
                }

                grid.appendChild(cell);
            }
        }

        // 🎯 최초 실행 및 타이머 제어 정렬
        updateClock();
        setInterval(updateClock, 1000);

        // [수정 완료] 단순히 updateBackground()만 켜는 게 아니라, 사진을 완전히 다 탐색(discoverPhotos)한 후에 첫 배경을 띄우고 돌립니다.
        discoverPhotos(); 
        setInterval(updateBackground, photoChangeInterval);

        renderCalendar(); 
        fetchSchedules();
        setInterval(fetchSchedules, scheduleFetchInterval);

        fetchWeather();
        setInterval(fetchWeather, 1800000); 
    </script>
</body>
</html>
